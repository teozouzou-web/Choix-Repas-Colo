<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ColoResto - Gestion des Commandes</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          indigo: {
            50: '#f0f8ff',
            100: '#e0f0fe',
            400: '#4da6ff',
            500: '#3399ff',
            600: '#1E90FF', /* Votre bleu exact (couleur principale) */
            700: '#1873CC', /* Bleu légèrement assombri pour les survols (hover) */
          }
        }
      }
    }
  }
  </script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>


  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;


    const DEFAULT_CATEGORIES = [
      { id: 'cat-1', name: 'Choix 1', options: ['Burger', 'Nuggets', 'Poisson pané'] },
      { id: 'cat-2', name: 'Choix 2', options: ['Frites', 'Salade', 'Pâtes'] },
      { id: 'cat-3', name: 'Boisson', options: ['Eau', 'Sirop à l\'eau', 'Fanta', 'Coca', 'Ice Tea'] }
    ];


    const SAMPLE_CHILDREN = [
      { id: 'c-1', name: 'Lucas', choices: { 'cat-1': 'Burger', 'cat-2': 'Frites', 'cat-3': 'Fanta' }, served: false },
      { id: 'c-2', name: 'Emma', choices: { 'cat-1': 'Nuggets', 'cat-2': 'Frites', 'cat-3': 'Ice Tea' }, served: false },
      { id: 'c-3', name: 'Léo', choices: { 'cat-1': 'Burger', 'cat-2': 'Pâtes', 'cat-3': 'Coca' }, served: true },
      { id: 'c-4', name: 'Chloé', choices: { 'cat-1': 'Poisson pané', 'cat-2': 'Salade', 'cat-3': 'Eau' }, served: false },
      { id: 'c-5', name: 'Hugo', choices: { 'cat-1': 'Burger', 'cat-2': 'Frites', 'cat-3': 'Fanta' }, served: false }
    ];


    function ColoResto() {
      const [activeTab, setActiveTab] = useState('menu'); // 'menu' | 'orders' | 'results'
      
      // Chargement initial depuis localStorage
      const [categories, setCategories] = useState(() => {
        try {
          const saved = localStorage.getItem('coloresto_categories');
          return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
        } catch (e) {
          return DEFAULT_CATEGORIES;
        }
      });


      const [children, setChildren] = useState(() => {
        try {
          const saved = localStorage.getItem('coloresto_children');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });


      // Sauvegarde automatique
      useEffect(() => {
        try {
          localStorage.setItem('coloresto_categories', JSON.stringify(categories));
        } catch (e) {}
      }, [categories]);


      useEffect(() => {
        try {
          localStorage.setItem('coloresto_children', JSON.stringify(children));
        } catch (e) {}
      }, [children]);


      // États Étape 1 : Menu
      const [newCategoryName, setNewCategoryName] = useState('');
      const [newOptionInputs, setNewOptionInputs] = useState({});
      const [editingCatId, setEditingCatId] = useState(null);
      const [editingCatName, setEditingCatName] = useState('');


      // États Étape 2 : Prise de commande par enfant
      const [childName, setChildName] = useState('');
      const [currentChoices, setCurrentChoices] = useState({});
      const [editingChildId, setEditingChildId] = useState(null);
      const [orderFeedback, setOrderFeedback] = useState('');


      // États Étape 3 : Résultats & Service
      const [resultsSubView, setResultsSubView] = useState('all'); // 'all' | 'totals' | 'children'
      const [searchQuery, setSearchQuery] = useState('');
      const [copied, setCopied] = useState(false);


      // --- FONCTIONS ÉTAPE 1 : MENU ---
      const addCategory = (e) => {
        e.preventDefault();
        const trimmed = newCategoryName.trim();
        if (!trimmed) return;
        const newCat = {
          id: 'cat-' + Date.now(),
          name: trimmed,
          options: []
        };
        setCategories([...categories, newCat]);
        setNewCategoryName('');
      };


      const deleteCategory = (catId) => {
        if (!window.confirm('Supprimer cette catégorie et ses options ?')) return;
        setCategories(categories.filter(c => c.id !== catId));
        const updatedChoices = { ...currentChoices };
        delete updatedChoices[catId];
        setCurrentChoices(updatedChoices);
      };


      const startRenameCategory = (cat) => {
        setEditingCatId(cat.id);
        setEditingCatName(cat.name);
      };


      const saveRenameCategory = (catId) => {
        const trimmed = editingCatName.trim();
        if (trimmed) {
          setCategories(categories.map(c => c.id === catId ? { ...c, name: trimmed } : c));
        }
        setEditingCatId(null);
        setEditingCatName('');
      };


      const addOptionToCategory = (catId) => {
        const val = (newOptionInputs[catId] || '').trim();
        if (!val) return;
        setCategories(categories.map(cat => {
          if (cat.id !== catId) return cat;
          if (cat.options.includes(val)) return cat;
          return { ...cat, options: [...cat.options, val] };
        }));
        setNewOptionInputs({ ...newOptionInputs, [catId]: '' });
      };


      const removeOptionFromCategory = (catId, optionName) => {
        setCategories(categories.map(cat => {
          if (cat.id !== catId) return cat;
          return { ...cat, options: cat.options.filter(o => o !== optionName) };
        }));
      };


      const loadSampleData = () => {
        setCategories(DEFAULT_CATEGORIES);
        setChildren(SAMPLE_CHILDREN);
        setOrderFeedback('Exemple chargé avec 5 enfants !');
        setTimeout(() => setOrderFeedback(''), 2500);
      };


      const resetAllOrders = () => {
        if (!window.confirm('Effacer la liste de tous les enfants enregistrés ? (Le menu sera conservé)')) return;
        setChildren([]);
        setEditingChildId(null);
        setChildName('');
        setCurrentChoices({});
      };


      // --- FONCTIONS ÉTAPE 2 : SAISIE ENFANT PAR ENFANT ---
      const toggleChoice = (catId, optionName) => {
        setCurrentChoices(prev => ({
          ...prev,
          [catId]: prev[catId] === optionName ? '' : optionName
        }));
      };


      const handleSaveChild = (e) => {
        e.preventDefault();
        const trimmedName = childName.trim();
        if (!trimmedName) {
          alert("Merci d'entrer le prénom de l'enfant.");
          return;
        }


        if (editingChildId) {
          setChildren(children.map(ch =>
            ch.id === editingChildId
              ? { ...ch, name: trimmedName, choices: { ...currentChoices } }
              : ch
          ));
          setOrderFeedback(`Commande de ${trimmedName} modifiée !`);
          setEditingChildId(null);
        } else {
          const newChild = {
            id: 'child-' + Date.now(),
            name: trimmedName,
            choices: { ...currentChoices },
            served: false
          };
          setChildren([...children, newChild]);
          setOrderFeedback(`${trimmedName} enregistré(e) ! Au suivant 👇`);
        }


        setChildName('');
        setCurrentChoices({});
        setTimeout(() => setOrderFeedback(''), 2200);
      };


      const startEditChild = (child) => {
        setEditingChildId(child.id);
        setChildName(child.name);
        setCurrentChoices({ ...child.choices });
        setActiveTab('orders');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };


      const deleteChild = (childId) => {
        setChildren(children.filter(c => c.id !== childId));
        if (editingChildId === childId) {
          setEditingChildId(null);
          setChildName('');
          setCurrentChoices({});
        }
      };


      const toggleServed = (childId) => {
        setChildren(children.map(c => c.id === childId ? { ...c, served: !c.served } : c));
      };


      // --- CALCULS ÉTAPE 3 : TOTAUX & LISTES ---
      const summaryByCategory = useMemo(() => {
        return categories.map(cat => {
          const itemsMap = {};
          cat.options.forEach(opt => {
            itemsMap[opt] = [];
          });


          const unspecified = [];


          children.forEach(child => {
            const chosen = child.choices?.[cat.id];
            if (chosen) {
              if (!itemsMap[chosen]) itemsMap[chosen] = [];
              itemsMap[chosen].push(child.name);
            } else {
              unspecified.push(child.name);
            }
          });


          return {
            ...cat,
            itemsMap,
            unspecified
          };
        });
      }, [categories, children]);


      const generateTextSummary = () => {
        let lines = [`🍔 RÉCAPITULATIF COLORESTO (${children.length} enfants)`, ''];
        lines.push('=== 1. TOTAUX & LISTES PAR CHOIX ===');
        summaryByCategory.forEach(cat => {
          lines.push(`\n📌 ${cat.name.toUpperCase()} :`);
          Object.entries(cat.itemsMap).forEach(([optName, kids]) => {
            if (kids.length > 0) {
              lines.push(`- ${optName} = ${kids.length} (${kids.join(', ')})`);
            }
          });
          if (cat.unspecified.length > 0) {
            lines.push(`- Sans choix = ${cat.unspecified.length} (${cat.unspecified.join(', ')})`);
          }
        });


        lines.push('\n=== 2. CHOIX PAR ENFANT ===');
        children.forEach(child => {
          const parts = categories
            .map(cat => child.choices?.[cat.id])
            .filter(Boolean);
          lines.push(`- ${child.name} : ${parts.length ? parts.join(' + ') : 'Aucun choix'}`);
        });


        return lines.join('\n');
      };


      const copyToClipboard = () => {
        const text = generateTextSummary();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 2500);
          });
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);
        }
      };


      const filteredChildren = children.filter(c => {
        if (!searchQuery.trim()) return true;
        const q = searchQuery.toLowerCase();
        const matchName = c.name.toLowerCase().includes(q);
        const matchChoice = Object.values(c.choices || {}).some(val =>
          (val || '').toLowerCase().includes(q)
        );
        return matchName || matchChoice;
      });


      return (
        <div className="max-w-2xl mx-auto pb-24">
          {/* Header */}
          <header className="bg-indigo-600 text-white px-4 py-4 shadow-md sticky top-0 z-20">
            <div className="flex items-center justify-between">
              <div>
                <h1 className="text-xl font-bold tracking-tight flex items-center gap-2">
                  RestoScope
                </h1>
                <p className="text-xs text-indigo-100">
                  {children.length} enfant{children.length > 1 ? 's' : ''} enregistré{children.length > 1 ? 's' : ''} • Sauvegarde auto
                </p>
              </div>
              <div className="flex gap-2">
                <button
                  onClick={loadSampleData}
                  className="text-xs bg-indigo-500 hover:bg-indigo-400 px-2.5 py-1.5 rounded-lg font-medium transition"
                  title="Pré-remplir avec un exemple"
                >
                  ✨ Exemple
                </button>
                {children.length > 0 && (
                  <button
                    onClick={resetAllOrders}
                    className="text-xs bg-rose-500 hover:bg-rose-600 px-2.5 py-1.5 rounded-lg font-medium transition"
                  >
                    🗑️ Vider
                  </button>
                )}
              </div>
            </div>


            {/* Navigation 3 étapes */}
            <div className="grid grid-cols-3 gap-1.5 mt-3 bg-indigo-700/60 p-1 rounded-xl">
              <button
                onClick={() => setActiveTab('menu')}
                className={`py-2 px-2 rounded-lg text-xs sm:text-sm font-semibold transition ${
                  activeTab === 'menu'
                    ? 'bg-white text-indigo-700 shadow'
                    : 'text-indigo-100 hover:bg-indigo-600/50'
                }`}
              >
                1. Menu ⚙️
              </button>
              <button
                onClick={() => setActiveTab('orders')}
                className={`py-2 px-2 rounded-lg text-xs sm:text-sm font-semibold transition ${
                  activeTab === 'orders'
                    ? 'bg-white text-indigo-700 shadow'
                    : 'text-indigo-100 hover:bg-indigo-600/50'
                }`}
              >
                2. Enfants ({children.length}) ✍️
              </button>
              <button
                onClick={() => setActiveTab('results')}
                className={`py-2 px-2 rounded-lg text-xs sm:text-sm font-semibold transition ${
                  activeTab === 'results'
                    ? 'bg-white text-indigo-700 shadow'
                    : 'text-indigo-100 hover:bg-indigo-600/50'
                }`}
              >
                3. Résultats 📊
              </button>
            </div>
          </header>


          {/* Contenu Principal */}
          <main className="p-4 space-y-5">
            {orderFeedback && (
              <div className="bg-emerald-600 text-white px-4 py-2.5 rounded-xl shadow text-sm font-medium text-center animate-pulse">
                {orderFeedback}
              </div>
            )}


            {/* ÉTAPE 1 : CONFIGURATION DU MENU */}
            {activeTab === 'menu' && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                  <h2 className="font-bold text-slate-800 text-base mb-1">
                    Catégories & Choix du restaurant
                  </h2>
                  <p className="text-xs text-slate-500 mb-3">
                    Ajoutez ou modifiez librement vos catégories (ex: Choix 1, Choix 2, Boisson, Dessert...) et leurs options.
                  </p>


                  <form onSubmit={addCategory} className="flex gap-2">
                    <input
                      type="text"
                      value={newCategoryName}
                      onChange={(e) => setNewCategoryName(e.target.value)}
                      placeholder="Nouvelle catégorie (ex: Dessert, Sauce...)"
                      className="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    <button
                      type="submit"
                      className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-xl text-sm shrink-0"
                    >
                      + Catégorie
                    </button>
                  </form>
                </div>


                {categories.map((cat) => (
                  <div
                    key={cat.id}
                    className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3"
                  >
                    <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
                      {editingCatId === cat.id ? (
                        <div className="flex items-center gap-2 flex-1 mr-2">
                          <input
                            type="text"
                            value={editingCatName}
                            onChange={(e) => setEditingCatName(e.target.value)}
                            className="border border-indigo-400 rounded-lg px-2.5 py-1 text-sm font-bold flex-1"
                            autoFocus
                          />
                          <button
                            onClick={() => saveRenameCategory(cat.id)}
                            className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-semibold"
                          >
                            OK
                          </button>
                        </div>
                      ) : (
                        <h3 className="font-bold text-slate-800 text-base flex items-center gap-2">
                          <span className="w-2.5 h-2.5 rounded-full bg-indigo-600 inline-block"></span>
                          {cat.name}
                          <span className="text-xs font-normal text-slate-400">
                            ({cat.options.length} choix)
                          </span>
                        </h3>
                      )}


                      <div className="flex items-center gap-1.5">
                        <button
                          onClick={() => startRenameCategory(cat)}
                          className="text-slate-500 hover:text-indigo-600 p-1.5 rounded-lg hover:bg-slate-100 text-xs"
                          title="Renommer la catégorie"
                        >
                          ✏️ Renommer
                        </button>
                        <button
                          onClick={() => deleteCategory(cat.id)}
                          className="text-rose-500 hover:text-rose-700 p-1.5 rounded-lg hover:bg-rose-50 text-xs"
                          title="Supprimer la catégorie"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>


                    {/* Liste des options de la catégorie */}
                    <div className="flex flex-wrap gap-2">
                      {cat.options.length === 0 && (
                        <span className="text-xs text-slate-400 italic">
                          Aucune option dans cette catégorie. Ajoutez-en ci-dessous.
                        </span>
                      )}
                      {cat.options.map((opt) => (
                        <span
                          key={opt}
                          className="inline-flex items-center gap-1.5 bg-slate-100 text-slate-800 px-3 py-1.5 rounded-xl text-sm font-medium"
                        >
                          {opt}
                          <button
                            onClick={() => removeOptionFromCategory(cat.id, opt)}
                            className="text-slate-400 hover:text-rose-600 font-bold ml-1"
                          >
                            ×
                          </button>
                        </span>
                      ))}
                    </div>


                    {/* Ajouter une option */}
                    <div className="flex gap-2 pt-1">
                      <input
                        type="text"
                        value={newOptionInputs[cat.id] || ''}
                        onChange={(e) =>
                          setNewOptionInputs({ ...newOptionInputs, [cat.id]: e.target.value })
                        }
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            addOptionToCategory(cat.id);
                          }
                        }}
                        placeholder={`Ajouter un choix dans "${cat.name}"...`}
                        className="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                      <button
                        type="button"
                        onClick={() => addOptionToCategory(cat.id)}
                        className="bg-slate-800 hover:bg-slate-900 text-white font-medium px-3.5 py-2 rounded-xl text-sm shrink-0"
                      >
                        + Ajouter
                      </button>
                    </div>
                  </div>
                ))}


                <button
                  onClick={() => setActiveTab('orders')}
                  className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-md transition text-base"
                >
                  Passer à la saisie des enfants (Étape 2) →
                </button>
              </div>
            )}


            {/* ÉTAPE 2 : SAISIE ENFANT PAR ENFANT */}
            {activeTab === 'orders' && (
              <div className="space-y-5">
                <form
                  onSubmit={handleSaveChild}
                  className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4"
                >
                  <div className="flex items-center justify-between">
                    <h2 className="font-bold text-slate-800 text-base">
                      {editingChildId ? '✏️ Modifier la commande' : '👦 Nouvel enfant'}
                    </h2>
                    {editingChildId && (
                      <button
                        type="button"
                        onClick={() => {
                          setEditingChildId(null);
                          setChildName('');
                          setCurrentChoices({});
                        }}
                        className="text-xs text-slate-500 underline"
                      >
                        Annuler la modification
                      </button>
                    )}
                  </div>


                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">
                      Prénom de l'enfant
                    </label>
                    <input
                      type="text"
                      value={childName}
                      onChange={(e) => setChildName(e.target.value)}
                      placeholder="Ex: Lucas, Chloé, Mathis..."
                      className="w-full border-2 border-slate-300 rounded-xl px-3.5 py-2.5 text-base font-semibold focus:outline-none focus:border-indigo-600"
                    />
                  </div>


                  {/* Choix par catégorie */}
                  {categories.map((cat) => (
                    <div key={cat.id} className="space-y-2">
                      <div className="flex items-center justify-between">
                        <label className="text-xs font-bold uppercase tracking-wider text-indigo-700">
                          {cat.name}
                        </label>
                        {currentChoices[cat.id] && (
                          <span className="text-xs font-semibold text-emerald-600">
                            Choisi : {currentChoices[cat.id]}
                          </span>
                        )}
                      </div>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                        {cat.options.map((opt) => {
                          const selected = currentChoices[cat.id] === opt;
                          return (
                            <button
                              type="button"
                              key={opt}
                              onClick={() => toggleChoice(cat.id, opt)}
                              className={`py-2.5 px-3 rounded-xl text-sm font-semibold border text-left transition flex items-center justify-between ${
                                selected
                                  ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                                  : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                              }`}
                            >
                              <span className="truncate">{opt}</span>
                              {selected && <span>✓</span>}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}


                  <button
                    type="submit"
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-md transition text-base"
                  >
                    {editingChildId
                      ? '✅ Enregistrer les modifications'
                      : "✅ Valider & Passer à l'enfant suivant"}
                  </button>
                </form>


                {/* Liste des enfants déjà saisis */}
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-slate-800 text-sm">
                      Enfants déjà enregistrés ({children.length})
                    </h3>
                    {children.length > 0 && (
                      <button
                        onClick={() => setActiveTab('results')}
                        className="text-xs font-bold text-indigo-600 hover:underline"
                      >
                        Voir le récapitulatif complet →
                      </button>
                    )}
                  </div>


                  {children.length === 0 ? (
                    <p className="text-xs text-slate-400 italic py-2">
                      Aucun enfant enregistré pour le moment.
                    </p>
                  ) : (
                    <div className="divide-y divide-slate-100">
                      {[...children].reverse().map((child) => (
                        <div
                          key={child.id}
                          className="py-2.5 flex items-center justify-between gap-2"
                        >
                          <div>
                            <p className="font-bold text-slate-800 text-sm">{child.name}</p>
                            <p className="text-xs text-slate-500">
                              {categories
                                .map((cat) => child.choices?.[cat.id])
                                .filter(Boolean)
                                .join(' • ') || 'Aucun choix sélectionné'}
                            </p>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            <button
                              onClick={() => startEditChild(child)}
                              className="text-xs bg-slate-100 hover:bg-indigo-50 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium"
                            >
                              ✏️
                            </button>
                            <button
                              onClick={() => deleteChild(child.id)}
                              className="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1.5 rounded-lg font-medium"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}


            {/* ÉTAPE 3 : RÉSULTATS COMPLETS (TOTAUX + LISTES D'ENFANTS + PAR ENFANT) */}
            {activeTab === 'results' && (
              <div className="space-y-5">
                {/* Barre d'actions rapides */}
                <div className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-2">
                  <div className="flex gap-1.5 bg-slate-100 p-1 rounded-xl">
                    <button
                      onClick={() => setResultsSubView('all')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                        resultsSubView === 'all'
                          ? 'bg-white text-indigo-700 shadow-sm'
                          : 'text-slate-600'
                      }`}
                    >
                      Tout voir
                    </button>
                    <button
                      onClick={() => setResultsSubView('totals')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                        resultsSubView === 'totals'
                          ? 'bg-white text-indigo-700 shadow-sm'
                          : 'text-slate-600'
                      }`}
                    >
                      Par plat (Totaux)
                    </button>
                    <button
                      onClick={() => setResultsSubView('children')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                        resultsSubView === 'children'
                          ? 'bg-white text-indigo-700 shadow-sm'
                          : 'text-slate-600'
                      }`}
                    >
                      Par enfant
                    </button>
                  </div>


                  <button
                    onClick={copyToClipboard}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-sm transition"
                  >
                    {copied ? '✅ Copié !' : '📋 Copier tout (WhatsApp/SMS)'}
                  </button>
                </div>


                {/* SECTION A : TOTAUX PAR CHOIX + LISTE DES ENFANTS SOUS CHAQUE ÉLÉMENT */}
                {(resultsSubView === 'all' || resultsSubView === 'totals') && (
                  <div className="space-y-4">
                    <h2 className="font-bold text-slate-800 text-base px-1">
                      📊 Totaux & Liste des enfants pour chaque choix
                    </h2>


                    {summaryByCategory.map((cat) => (
                      <div
                        key={cat.id}
                        className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3"
                      >
                        <h3 className="font-bold text-indigo-700 text-sm uppercase tracking-wider border-b border-slate-100 pb-2">
                          {cat.name}
                        </h3>


                        <div className="space-y-2.5">
                          {Object.entries(cat.itemsMap).map(([optName, kids]) => (
                            <div
                              key={optName}
                              className={`p-3 rounded-xl border ${
                                kids.length > 0
                                  ? 'bg-slate-50 border-slate-200'
                                  : 'bg-slate-50/40 border-slate-100 opacity-60'
                              }`}
                            >
                              <div className="flex items-center justify-between">
                                <span className="font-bold text-slate-900 text-base">
                                  {optName}
                                </span>
                                <span
                                  className={`px-3 py-1 rounded-full text-sm font-extrabold ${
                                    kids.length > 0
                                      ? 'bg-indigo-600 text-white'
                                      : 'bg-slate-200 text-slate-600'
                                  }`}
                                >
                                  = {kids.length}
                                </span>
                              </div>


                              {kids.length > 0 && (
                                <div className="mt-2 flex flex-wrap gap-1.5">
                                  {kids.map((kidName, idx) => (
                                    <span
                                      key={idx}
                                      className="bg-white border border-slate-200 text-slate-700 text-xs font-semibold px-2.5 py-1 rounded-lg shadow-2xs"
                                    >
                                      {kidName}
                                    </span>
                                  ))}
                                </div>
                              )}
                            </div>
                          ))}


                          {cat.unspecified.length > 0 && (
                            <div className="p-3 rounded-xl border border-amber-200 bg-amber-50">
                              <div className="flex items-center justify-between">
                                <span className="font-bold text-amber-900 text-sm">
                                  ⚠️ Sans choix pour {cat.name}
                                </span>
                                <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-200 text-amber-900">
                                  = {cat.unspecified.length}
                                </span>
                              </div>
                              <p className="text-xs text-amber-800 mt-1">
                                {cat.unspecified.join(', ')}
                              </p>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}


                {/* SECTION B : CHOIX POUR CHAQUE ENFANT (AVEC COCHE DE SERVICE) */}
                {(resultsSubView === 'all' || resultsSubView === 'children') && (
                  <div className="space-y-3">
                    <div className="flex items-center justify-between px-1">
                      <h2 className="font-bold text-slate-800 text-base">
                        🍽️ Choix détaillés par enfant ({children.length})
                      </h2>
                      <span className="text-xs text-slate-500">
                        {children.filter((c) => c.served).length}/{children.length} servis
                      </span>
                    </div>


                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="🔍 Rechercher un prénom ou un plat (ex: Burger)..."
                      className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />


                    {filteredChildren.length === 0 ? (
                      <div className="bg-white p-6 rounded-2xl text-center text-slate-400 text-sm">
                        Aucun enfant trouvé.
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {filteredChildren.map((child) => (
                          <div
                            key={child.id}
                            onClick={() => toggleServed(child.id)}
                            className={`p-3.5 rounded-2xl border transition cursor-pointer flex items-center justify-between gap-3 ${
                              child.served
                                ? 'bg-emerald-50/70 border-emerald-200 opacity-75'
                                : 'bg-white border-slate-200 shadow-2xs'
                            }`}
                          >
                            <div className="space-y-1">
                              <div className="flex items-center gap-2">
                                <span
                                  className={`font-bold text-base ${
                                    child.served ? 'line-through text-slate-500' : 'text-slate-900'
                                  }`}
                                >
                                  {child.name}
                                </span>
                                {child.served && (
                                  <span className="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded-full font-semibold">
                                    Servi ✓
                                  </span>
                                )}
                              </div>
                              <div className="flex flex-wrap gap-1.5">
                                {categories.map((cat) => {
                                  const val = child.choices?.[cat.id];
                                  if (!val) return null;
                                  return (
                                    <span
                                      key={cat.id}
                                      className="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg font-medium"
                                    >
                                      <strong className="text-slate-500">{cat.name}:</strong> {val}
                                    </span>
                                  );
                                })}
                              </div>
                            </div>


                            <div className="flex items-center gap-2 shrink-0">
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  startEditChild(child);
                                }}
                                className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg"
                                title="Modifier"
                              >
                                ✏️
                              </button>
                              <input
                                type="checkbox"
                                checked={!!child.served}
                                onChange={() => {}}
                                className="w-5 h-5 accent-emerald-600 rounded cursor-pointer"
                              />
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ColoResto />);
  </script>
</body>
</html>
